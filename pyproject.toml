[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-budget-tuner"
version = "0.10.0"
description = "Portable vision training configuration search and empirical optimality research"
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "torchvision>=0.21", "numpy>=1.26,<3", "Pillow>=10", "ultralytics>=8.4.175,<9", "PyYAML>=6", "psutil>=5", "nvidia-ml-py>=12", "sacrebleu>=2.5,<3"]

[project.optional-dependencies]
evaluation = ["sacrebleu>=2.5,<3"]

[project.scripts]
yolo-tune = "yolo_tuner.cli:main"
train-config = "research_pipeline.v2.cli:main"

[tool.setuptools.packages.find]
include = ["yolo_tuner*", "research_pipeline*"]
